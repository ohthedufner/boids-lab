plugins {
    id("com.android.application")
}

// Release signing is optional and private: if tv_app/keystore/release.properties
// exists (copied from the boids-tv-release vault; the folder is gitignored),
// release builds are signed with it. Absent it, they build unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore/release.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "org.boidslab.tv.lab"
    compileSdk 37

    defaultConfig {
        applicationId "org.boidslab.tv.lab"
        minSdk 26
        targetSdk 37
        versionCode 3
        versionName "1.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += "../shared/src"
            assets.srcDirs += layout.buildDirectory.dir("webAssets").get().asFile
        }
    }
}

// The HTML is the app. Pull the pages straight from the repo at build time —
// one source of truth, nothing hand-copied: the model, the full instrument,
// the pocket remote, and the TV wrapper with its D-pad panel.
def repoRoot = rootProject.projectDir.parentFile
tasks.register("copyWebAssets", Copy) {
    from(repoRoot) { include "model.html", "tablet.html", "remote.html" }
    from(new File(rootProject.projectDir, "web")) { include "tv.html" }
    into layout.buildDirectory.dir("webAssets")
}
preBuild.dependsOn "copyWebAssets"
tasks.matching { it.name.contains("Assets") && it.name != "copyWebAssets" }.configureEach {
    dependsOn "copyWebAssets"
}
